name: zarrebin-bot
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
concurrency: { group: zarrebin-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: renderer-${{ hashFiles('package.json') }}
      - name: Run bot (live for about 5 minutes)
        run: python3 bot.py serve
      - name: Save state
        if: always()
        run: |
          git config user.name "zarrebin-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && (git pull --rebase -q -X ours || true) && git push)
