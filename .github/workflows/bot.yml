name: zarrebin-bot
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
concurrency: { group: zarrebin-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Telegram updates
        id: check
        run: python3 bot.py check
      - name: Install renderer
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          which ffmpeg || sudo apt-get install -y ffmpeg
      - name: Render and send
        if: steps.check.outputs.has_jobs == 'true'
        run: python3 bot.py render
      - name: Save state
        if: always()
        run: |
          git config user.name "zarrebin-bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
